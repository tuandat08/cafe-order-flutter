name: cafe_admin
description: Cafe Admin Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  cloud_firestore: ^5.3.0
  firebase_storage: ^12.3.0

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.7

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  http: ^1.6.0
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  crypto: ^3.0.5
  image_picker: ^1.1.2
  uuid: ^4.4.2
  url_launcher: ^6.3.0

  # In hóa đơn
  printing: ^5.13.3
  pdf: ^3.11.1

  # In hóa đơn qua máy in nhiệt ESC/POS (LAN/Wi-Fi hoặc Bluetooth)
  shared_preferences: ^2.3.3
  esc_pos_utils_plus: ^2.0.4
  flutter_pos_printer_platform_image_3: ^1.1.9
  image: ^4.2.0

  # Âm thanh + giọng đọc thông báo (giống useAudioNotification web)
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  firebase_auth: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    # Font in hóa đơn PDF (Roboto, Apache 2.0) — đóng gói sẵn để in được khi mất mạng
    - assets/fonts/
